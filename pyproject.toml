[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "scifig"
version = "0.2.0"
description = "Reproducible, agent-native scientific figures with Matplotlib"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "scifig contributors"}]
dependencies = ["matplotlib>=3.9,<4", "numpy>=1.26", "pandas>=2.2,<4", "pydantic>=2.9,<3", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pillow>=10", "build>=1.2", "pypdf>=5"]

[project.scripts]
scifig = "scifig.cli:main"

[project.urls]
Homepage = "https://github.com/giacolees/scifig"
Repository = "https://github.com/giacolees/scifig"
Issues = "https://github.com/giacolees/scifig/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/scifig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
